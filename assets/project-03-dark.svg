<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-labelledby="t"><title id="t">claude-usage-tracker</title><style>
text{font-family:ui-monospace,'Fira Code',SFMono-Regular,Menlo,Consolas,monospace}.t1{fill:#f1eaff}.t2{fill:#c4b5e6}.t3{fill:#8174a8}.acc{fill:#a56bff}
.scan{animation:s 4.5s ease-in-out infinite}@keyframes s{0%{transform:translateY(-30px);opacity:0}20%{opacity:.5}80%{opacity:.5}100%{transform:translateY(200px);opacity:0}}
.arrow{animation:a 1.6s ease-in-out infinite}@keyframes a{50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.scan,.arrow{animation:none}}
</style><defs><clipPath id="c"><rect width="400" height="200"/></clipPath><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a56bff" stop-opacity="0"/><stop offset=".5" stop-color="#a56bff" stop-opacity=".45"/><stop offset="1" stop-color="#a56bff" stop-opacity="0"/></linearGradient></defs>
<rect width="400" height="360" fill="#0a0710"/>
<g clip-path="url(#c)"><rect width="400" height="200" fill="#1e1238"/>
<g font-family="ui-monospace,Consolas,monospace">
<text x="28" y="52" font-size="11" letter-spacing="1.2" fill="#8174a8">SESSION · 5H</text>
<rect x="28" y="62" width="344" height="12" rx="2" fill="#120d1d" stroke="#2a1f45"/>
<rect x="28" y="62" width="120" height="12" rx="2" fill="#a56bff"><animate attributeName="width" values="90;230;90" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/></rect>
<text x="28" y="108" font-size="11" letter-spacing="1.2" fill="#8174a8">WEEKLY</text>
<rect x="28" y="118" width="344" height="12" rx="2" fill="#120d1d" stroke="#2a1f45"/>
<rect x="28" y="118" width="170" height="12" rx="2" fill="#e4d2ff" opacity=".85"><animate attributeName="width" values="150;200;150" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/></rect>
<g transform="translate(300 146)"><rect width="72" height="38" rx="8" fill="#120d1d" stroke="#2a1f45"/><text x="36" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#a56bff">42<animate attributeName="opacity" values="1;1;.5;1" dur="3s" repeatCount="indefinite"/></text></g>
<text x="28" y="172" font-size="11" fill="#8174a8">resets in 2h 14m</text>
</g><rect class="scan" width="400" height="30" fill="url(#g)"/></g>
<line x1="0" x2="400" y1="200.5" y2="200.5" stroke="#2a1f45"/>
<text x="20" y="234" class="t3" font-size="11" letter-spacing="1.2">PROJECT 03</text>
<text x="20" y="262" class="t1" font-size="18" font-weight="700">claude-usage-tracker</text>
<text x="20" y="284" class="t2" font-size="12">Tray icon with your Claude limits:</text><text x="20" y="300" class="t2" font-size="12">5-hour session + weekly.</text>
<rect x="20" y="318" width="58" height="22" rx="4" fill="none" stroke="#2a1f45"/><text x="28" y="333" class="t2" font-size="11">Python</text><rect x="86" y="318" width="65" height="22" rx="4" fill="none" stroke="#2a1f45"/><text x="94" y="333" class="t2" font-size="11">Windows</text>
<g class="arrow acc"><text x="360" y="334" font-size="16">&#8594;</text></g>
<rect x=".5" y=".5" width="399" height="359" fill="none" stroke="#2a1f45"/></svg>