name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6a35c9&color_dots=#e2d6f7,#bba0ec,#8f62dc,#6a35c9,#3d1f78
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a56bff&color_dots=#1e1238,#3d1f78,#6a35c9,#a56bff,#e4d2ff&color_dots_empty=#120d1d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
